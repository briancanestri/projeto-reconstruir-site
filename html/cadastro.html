<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Reconstruir - Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Cadastro</h1>
    </header>

    <nav>
        <a href="index.html">Início</a>

        <div class="dropdown">
            <a href="projetos.html">Projetos ▾</a>

            <div class="dropdown-menu">
                <a href="projetos.html#ajudar">Ajudar</a>
            </div>
        </div>

        <a href="cadastro.html">Cadastro</a>
    </nav>

    <main>

        <section>
            <h2>Formulário de Voluntários e Doadores</h2>

            <div class="alerta" id="alerta" role="alert" hidden>
                Cadastro realizado com sucesso!
            </div>

            <form id="formulario" novalidate>

                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    <label for="cpf">CPF:</label>
                    <input type="text"
                        id="cpf"
                        name="cpf"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        placeholder="000.000.000-00"
                        title="Formato: 000.000.000-00"
                        required>

                </fieldset>

                <fieldset>
                    <legend>Contato e Endereço</legend>

                    <label for="telefone">Telefone:</label>
                    <input type="tel"
                        id="telefone"
                        name="telefone"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        placeholder="(00) 00000-0000"
                        title="Formato: (00) 00000-0000"
                        required>

                    <label for="cep">CEP:</label>
                    <input type="text"
                        id="cep"
                        name="cep"
                        pattern="[0-9]{5}-[0-9]{3}"
                        placeholder="00000-000"
                        title="Formato: 00000-000"
                        required>

                </fieldset>

                <fieldset>
                    <legend>Tipo de Cadastro</legend>

                    <label for="tipo">Tipo de cadastro:</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecione</option>
                        <option value="doador">Doador</option>
                        <option value="voluntario">Voluntário</option>
                    </select>

                </fieldset>

                <button type="submit">Enviar</button>

            </form>

            <div id="historico-cadastros"></div>

        </section>

    </main>

    <footer>
        <p>© 2026 Projeto Reconstruir</p>
    </footer>

</body>

</html>
